# Static sites have no compute plan; no paid database, worker or VM is provisioned.
services:
  - type: web
    runtime: static
    name: gyliber-drawlab
    branch: main
    buildCommand: bash scripts/build-render.sh
    staticPublishPath: web/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Cache-Control
        value: no-cache
