name: Temporary formatting probe
on:
  push:
    branches: [feat/v0.3-moment-analysis]
permissions:
  contents: read
jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: npm --prefix web ci --ignore-scripts
      - name: Output exact formatter results for review
        run: |
          cd web
          npx prettier --write src/main.ts index.html tests/browser.spec.ts
          for file in src/main.ts index.html tests/browser.spec.ts; do
            echo "BEGIN_FORMAT_${file}"
            base64 -w0 "$file"
            echo
            echo "END_FORMAT_${file}"
          done
