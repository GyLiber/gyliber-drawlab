[workspace]
members = ["crates/drawlab-core", "crates/drawlab-cli", "crates/drawlab-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.4", features = ["wasm_js"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
